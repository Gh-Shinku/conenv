name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build and package all targets
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          build_dir=$(mktemp -d)
          trap 'rm -rf -- "$build_dir"' EXIT

          for os in windows linux darwin; do
            for arch in amd64 arm64; do
              archive="conenv-$os-$arch"
              binary=conenv
              if [[ "$os" == windows ]]; then
                binary=conenv.exe
              fi

              GOOS="$os" GOARCH="$arch" go build -trimpath -o "$build_dir/$binary" ./cmd/conenv
              if [[ "$os" == windows ]]; then
                zip -jq "dist/$archive.zip" "$build_dir/$binary"
              else
                tar -czf "dist/$archive.tar.gz" -C "$build_dir" "$binary"
              fi
            done
          done

          cd dist
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conenv-packages
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conenv-packages
          path: dist
      - name: Verify checksums and publish
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
